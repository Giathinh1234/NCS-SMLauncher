name: Build

# On a v* tag this workflow builds every platform AND publishes the artifacts
# to a GitHub release. That release step used to be described in the comment
# this one replaced, and did not exist: a tagged build produced artifacts
# nobody could download, and the in-app updater had nothing it could find. It
# is the `release` job at the bottom now.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# NOTE on the python-version below: 3.13, not 3.14, because pygame ships no
# 3.14 wheels. On 3.14 pip falls back to building pygame from source and dies
# on "Unable to run sdl-config" -- verified, all three platform jobs fail
# identically there and pass here. Bump when pygame ships 3.14 wheels, and
# update tests/test_ci_config.py in the same commit.

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the .app bundle
        run: ./build_macos_app.sh
      - name: Zip the bundle
        run: cd dist && zip -qry HashPlay.app.zip HashPlay.app
      - name: Build the stripped bundles
        # Two low-fuel builds from this same tree -- "lite" (no control API, no
        # NCS ball) and "micro" (also no video/ffmpeg and no torrents). A
        # second asset, never a second codebase: the tier is a constant in
        # src/build_variant.py plus HASHPLAY_PROFILE, which the .spec reads to
        # decide what to bundle at all.
        run: |
          ./scripts/build_macos_stripped.sh lite
          cd dist && zip -qry HashPlay-lite-macos-arm64.app.zip HashPlay-lite.app
          cd .. && ./scripts/build_macos_stripped.sh micro
          cd dist && zip -qry HashPlay-micro-macos-arm64.app.zip HashPlay-micro.app
      - name: Collect under the name the updater looks for
        run: |
          mkdir -p upload
          cp dist/HashPlay upload/HashPlay-macos-arm64
          cp dist/HashPlay.app.zip upload/ || true
          # The stripped builds ship alongside the full one. Their own
          # .app.zip files, NOT the bare executable, so they can never be
          # confused for each other in the asset list.
          cp dist/HashPlay-lite-macos-arm64.app.zip upload/ || true
          cp dist/HashPlay-micro-macos-arm64.app.zip upload/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: HashPlay-macos-arm64
          path: upload/

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 portaudio19-dev ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the single-file executable
        run: ./scripts/build_linux.sh
      - name: Collect under the name the updater looks for
        run: |
          mkdir -p upload
          cp dist/HashPlay upload/HashPlay-linux-x86_64
          cp dist/*.tar.gz upload/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: HashPlay-linux-x86_64
          path: upload/

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        # The build script is a bash script and PyInstaller behaves better
        # with a real shell on Windows, so use Git Bash for the whole job.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the single-file executable
        run: ./scripts/build_windows.sh
      - name: Collect under the name the updater looks for
        run: |
          mkdir -p upload
          cp dist/HashPlay-windows-x64.exe upload/
          cp dist/*.zip upload/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: HashPlay-windows-x64
          path: upload/

  # The names the updater can actually match live in src/updater.py's
  # _asset_matches_platform. A release that does not use them is invisible to
  # the app no matter how good the build is -- which is exactly what happened
  # for every release up to v1.1.0-rc.1.
  asset-names:
    name: Release asset names are discoverable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the names against the real matcher
        run: python tools/check_asset_names.py

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not 21: the Gradle/AGP versions pinned in android/ are tested
          # against 17, and compose + R8 both warn on newer toolchains.
          java-version: "17"

      - uses: android-actions/setup-android@v3
        # setup-android already runs `sdkmanager --licenses` for us, with
        # accept-android-sdk-licenses: true. This step used to run --licenses
        # and then `sdkmanager "platforms;android-34" "build-tools;34.0.0"` --
        # and the first run of rc.5 failed on `sdkmanager tools` returning
        # "Failed to find package 'tools'", a package that no longer exists in
        # modern command-line-tools. Only the platform and build-tools are
        # asked for here, and a missing one fails the build on its own.

      - name: Install the SDK packages this app needs
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Write local.properties
        # AGP needs the SDK path in a file, not only in ANDROID_HOME. Written
        # here rather than committed because it is machine-specific.
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore the signing key
        # The keystore is a repo secret, never a committed file. A release APK
        # signed with the wrong key can never be replaced, so this failing
        # loudly is the point.
        env:
          KEYSTORE_B64: ${{ secrets.HASHPLAY_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.HASHPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HASHPLAY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::HASHPLAY_KEYSTORE_B64 is not set. Cannot sign a" \
                 "release APK -- an unsigned one cannot be installed." \
                 "Add it under Settings > Secrets, or push a tag with the" \
                 "HASHPLAY_SKIP_ANDROID job skipped."
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/hashplay-release.jks
          # Never print the password or the key contents.
          {
            echo "HASHPLAY_KEYSTORE=$PWD/android/keystore/hashplay-release.jks"
            echo "HASHPLAY_KEY_ALIAS=$KEY_ALIAS"
            echo "HASHPLAY_KEY_PASS=$KEY_PASSWORD"
            echo "HASHPLAY_STORE_PASS=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build both APKs
        run: ./scripts/build_android_apks.sh both

      - name: Prove the lite APK really is lighter
        # R8 does most of the work here, and a mis-scoped packaging rule can
        # silently strip the torrent engine from the FULL build instead -- which
        # still produces a passing build. Assert the shape, do not trust it.
        run: |
          set -euo pipefail
          FULL=$(find android/app/build/outputs/apk/full/release -name '*.apk' | head -1)
          LITE=$(find android/app/build/outputs/apk/lite/release -name '*.apk' | head -1)
          test -n "$FULL" && test -n "$LITE" || {
            echo "::error::an APK is missing"; exit 1; }

          unzip -l "$FULL" | grep -q libtorrent4j.so || {
            echo "::error::full APK has no torrent engine -- the exclude leaked"; exit 1; }
          if unzip -l "$LITE" | grep -q libtorrent4j.so; then
            echo "::error::lite APK still ships the 12 MB torrent engine"; exit 1;
          fi

          FS=$(stat -c%s "$FULL"); LS=$(stat -c%s "$LITE")
          echo "full $((FS/1048576)) MB, lite $((LS/1048576)) MB"
          [ "$LS" -lt "$FS" ] || { echo "::error::lite is not smaller"; exit 1; }
          echo "lite is $(( (FS-LS)*100/FS ))% smaller"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/full/release/*.apk
            android/app/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows, android, asset-names]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble the payload
        run: |
          mkdir -p payload
          # Deliberately broad. The three desktop jobs name their artifacts
          # differently ("HashPlay.app.zip", "HashPlay-lite-macos-arm64.app.zip",
          # "HashPlay-linux-x86_64-<version>.tar.gz"), and an earlier version
          # of this step enumerated them -- and missed HashPlay.app.zip
          # entirely, which would have silently dropped the main macOS
          # download. The APKs are renamed explicitly below, since Gradle's
          # names really are ambiguous.
          find dist -type f \( \
            -name 'HashPlay-macos-arm64' -o \
            -name 'HashPlay-linux-x86_64' -o \
            -name 'HashPlay-windows-x64.exe' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' \) -exec cp {} payload/ \;
          for f in $(find dist -name 'app-full-release.apk'); do
            cp "$f" "payload/HashPlay-full-android-arm64.apk"
          done
          for f in $(find dist -name 'app-lite-release.apk'); do
            cp "$f" "payload/HashPlay-lite-android-arm64.apk"
          done
          ls -la payload/
      - name: Checksums
        run: |
          cd payload
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          files: payload/*
          generate_release_notes: true
          # A tag carrying a pre-release marker stays a pre-release, so
          # v1.1.0-rc.1 is never offered to someone as the finished 1.1.0.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
